<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="{{ site.description | escape }}" />
        <meta name="author" content="Impresiones GOLD" />
        <title>{{ page.title | default: site.title | escape }}</title>
        <link rel="icon" type="image/x-icon" href="/catalogo/assets/favicon.ico" />
        <!-- Bootstrap icons-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap" rel="stylesheet">
        <!-- Core theme CSS (includes Bootstrap)-->
        <link href="/catalogo/css/styles.css" rel="stylesheet" />
        <!-- Scripts-->
        <script type="text/javascript" src="/catalogo/js/carrito.js"></script>
    </head>
    <body>
        <a class="skip-link" href="#contenido-principal">Saltar al contenido</a>
        {% include navs.html %}
        <main id="contenido-principal" class="flex-shrink-0">
            {{ content }}
        </main>
        <!-- Footer-->
        <footer class="site-footer py-4">
            <div class="container">
                <p class="m-0 text-center">Catálogo ilustrativo. Consultas por correo electrónico.</p>
                <nav class="legal-footer-links" aria-label="Información legal">
                    <a href="/catalogo/privacidad.html">Política de privacidad</a>
                    <a href="/catalogo/terminos.html">Términos y condiciones</a>
                    <a href="/catalogo/cookies.html">Política de cookies</a>
                    <a href="/catalogo/reembolsos.html">Cambios, retracto y reembolsos</a>
                </nav>
            </div>
        </footer>
        <script>
            (function () {
                const THEME_KEY = 'fdm-theme';
                const root = document.documentElement;
                const defaultTheme = 'system';

                function getSystemTheme() {
                    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                }

                function getStoredTheme() {
                    return localStorage.getItem(THEME_KEY) || defaultTheme;
                }

                function applyTheme(theme) {
                    const finalTheme = theme === 'system' ? getSystemTheme() : theme;
                    root.setAttribute('data-theme', finalTheme);
                    document.body.setAttribute('data-theme', finalTheme);

                    const themeOptions = document.querySelectorAll('.theme-option');
                    themeOptions.forEach((button) => {
                        const isActive = button.dataset.theme === theme;
                        button.classList.toggle('active', isActive);
                        button.setAttribute('aria-pressed', String(isActive));
                    });

                    const label = document.querySelector('.theme-label');
                    if (label) {
                        const labels = { system: 'Sistema', dark: 'Oscuro', light: 'Claro' };
                        label.textContent = labels[theme] || 'Tema';
                    }
                }

                function saveTheme(theme) {
                    localStorage.setItem(THEME_KEY, theme);
                    applyTheme(theme);
                }

                function setCartOpen(isOpen) {
                    const cartDrawer = document.getElementById('carrito');
                    const cartBackdrop = document.getElementById('cartBackdrop');
                    const cartToggleBtn = document.getElementById('cartToggleBtn');

                    if (!cartDrawer || !cartBackdrop || !cartToggleBtn) {
                        return;
                    }

                    const wasOpen = cartDrawer.classList.contains('show');
                    cartDrawer.classList.toggle('show', isOpen);
                    cartBackdrop.classList.toggle('show', isOpen);
                    cartBackdrop.hidden = !isOpen;
                    cartDrawer.setAttribute('aria-hidden', String(!isOpen));
                    cartDrawer.inert = !isOpen;
                    cartToggleBtn.setAttribute('aria-expanded', String(isOpen));
                    if (isOpen) {
                        cartDrawer.querySelector('.cart-close').focus();
                    } else if (wasOpen) {
                        cartToggleBtn.focus();
                    }
                }

                window.toggleCartDrawer = function () {
                    const cartDrawer = document.getElementById('carrito');
                    if (!cartDrawer) {
                        return false;
                    }
                    const isOpen = !cartDrawer.classList.contains('show');
                    setCartOpen(isOpen);
                    return false;
                };

                window.closeCartDrawer = function () {
                    setCartOpen(false);
                    return false;
                };

                document.addEventListener('DOMContentLoaded', function () {
                    const themeButtons = document.querySelectorAll('.theme-option');
                    themeButtons.forEach((button) => {
                        button.addEventListener('click', function () {
                            saveTheme(button.dataset.theme);
                        });
                    });

                    const preferredTheme = getStoredTheme();
                    applyTheme(preferredTheme);

                    const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
                    const systemListener = () => {
                        const currentTheme = getStoredTheme();
                        if (currentTheme === 'system') {
                            applyTheme('system');
                        }
                    };

                    if (typeof mediaQuery.addEventListener === 'function') {
                        mediaQuery.addEventListener('change', systemListener);
                    } else if (typeof mediaQuery.addListener === 'function') {
                        mediaQuery.addListener(systemListener);
                    }

                    document.addEventListener('click', function (event) {
                        const cartDrawer = document.getElementById('carrito');
                        const cartToggleBtn = document.getElementById('cartToggleBtn');
                        const cartBackdrop = document.getElementById('cartBackdrop');

                        if (!cartDrawer || !cartToggleBtn || !cartBackdrop) {
                            return;
                        }

                        const clickInsideCart = cartDrawer.contains(event.target);
                        const clickToggle = cartToggleBtn.contains(event.target);
                        const clickBackdrop = cartBackdrop.contains(event.target);

                        if (cartDrawer.classList.contains('show') && !clickInsideCart && !clickToggle && !clickBackdrop) {
                            window.closeCartDrawer();
                        }
                    });

                    document.addEventListener('keydown', function (event) {
                        if (event.key === 'Escape') {
                            const cartDrawer = document.getElementById('carrito');
                            if (cartDrawer && cartDrawer.classList.contains('show')) {
                                window.closeCartDrawer();
                            }
                            return;
                        }

                        const cartDrawer = document.getElementById('carrito');
                        if (event.key === 'Tab' && cartDrawer && cartDrawer.classList.contains('show')) {
                            const focusable = Array.from(cartDrawer.querySelectorAll('button:not(:disabled), a[href]'));
                            const first = focusable[0];
                            const last = focusable[focusable.length - 1];
                            if (event.shiftKey && document.activeElement === first) {
                                event.preventDefault();
                                last.focus();
                            } else if (!event.shiftKey && document.activeElement === last) {
                                event.preventDefault();
                                first.focus();
                            }
                        }
                    });

                    setCartOpen(false);
                });
            })();
        </script>    </body>
</html>
